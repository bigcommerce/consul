# BigCommerce build of the patched Consul binary.
#
# Pushes to `main-bc` build linux/amd64 and upload it as a workflow artifact.
# Pushing a `v*-bc*` tag also publishes the zip and SHA256SUMS as a GitHub
# release, which fpm-cookery packages into the consul deb.

name: bc-build

on:
  push:
    branches:
      - 'main-bc'
    tags:
      - 'v*-bc*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-go-version:
    uses: ./.github/workflows/reusable-get-go-version.yml

  build:
    needs: get-go-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
          package_json_file: ui/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'ui/package.json'
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'

      # Same as upstream build.yml: replace the committed UI assets with a fresh build
      - name: Build UI
        run: |
          CONSUL_VERSION=$(cat version/VERSION)
          CONSUL_DATE=$(build-support/scripts/build-date.sh)
          CONSUL_COPYRIGHT_YEAR=$(git show -s --format=%cd --date=format:%Y HEAD)
          export CONSUL_VERSION CONSUL_DATE CONSUL_COPYRIGHT_YEAR
          cd ui && make && cd ..
          rm -rf agent/uiserver/dist
          mv ui/packages/consul-ui/dist agent/uiserver/

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        # hashicorpmetrics matches upstream's release build (hashicorp/consul#23813).
        # It's a no-op with the v2.1.0 dependencies, but without it older Raft,
        # Serf and Memberlist versions emit to armon/go-metrics and their metrics
        # are lost.
        run: |
          T="github.com/hashicorp/consul/version"
          go build -trimpath -buildvcs=false -tags hashicorpmetrics \
            -ldflags "-X ${T}.GitCommit=${GITHUB_SHA::8} -X ${T}.BuildDate=$(build-support/scripts/build-date.sh)" \
            -o dist/consul .
          ./dist/consul version

      # Tag vX.Y.Z-bc.N must build Consul vX.Y.Z-bcN, so a release can't ship with
      # a stale version/VERSION or VersionPrerelease.
      - name: Check version matches tag
        if: github.ref_type == 'tag'
        run: |
          want="Consul ${GITHUB_REF_NAME/-bc./-bc}"
          got=$(./dist/consul version | head -1)
          if [ "$got" != "$want" ]; then
            echo "::error::Built '${got}', but tag ${GITHUB_REF_NAME} expects '${want}'"
            exit 1
          fi

      - name: Archive
        run: |
          ZIP="consul_${GITHUB_REF_NAME}_linux_amd64.zip"
          (cd dist && zip "../${ZIP}" consul)
          sha256sum "${ZIP}" > SHA256SUMS
          cat SHA256SUMS
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP }}
          path: |
            ${{ env.ZIP }}
            SHA256SUMS

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: consul_${{ github.ref_name }}_linux_amd64.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "BigCommerce build of ${GITHUB_REF_NAME} (${GITHUB_SHA::8})." \
            "consul_${GITHUB_REF_NAME}_linux_amd64.zip" SHA256SUMS

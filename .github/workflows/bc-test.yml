# BigCommerce unit tests for the patched Consul.
#
# Upstream's go-tests and lint workflows need HashiCorp's runners and secrets,
# so on this fork they queue for 24h and then fail. This runs on standard
# runners: type-check every package and its tests, then run the unit tests for
# the packages the BC patches and backports change.

name: bc-test

on:
  pull_request:
    branches:
      - 'main-bc'
      - '*.x-bc'
  push:
    branches:
      - 'main-bc'
      - '*.x-bc'
    tags:
      - 'v*-bc*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-go-version:
    uses: ./.github/workflows/reusable-get-go-version.yml

  vet:
    needs: get-go-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      # Catches a signature change that breaks callers in packages the unit job
      # doesn't run. lostcancel is off because upstream v2.0.4 trips it
      # (agent/grpc-external/services/peerstream/stream_resources.go).
      # hashicorpmetrics, here and in the tests, matches the release build.
      - name: Vet
        run: go vet -tags hashicorpmetrics -lostcancel=false ./...

  unit:
    needs: get-go-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      # Reruns failed tests, as upstream's reusable-unit.yml does: some upstream
      # tests are timing-sensitive on small runners, e.g.
      # TestServer_DeltaAggregatedResources_v3_ACLEnforcement/default_deny,_no_token
      # fails about 1 run in 10 with 2 CPUs.
      - name: Test
        run: |
          go run gotest.tools/gotestsum@v1.12.3 \
            --format=github-actions \
            --rerun-fails \
            --packages="./acl/... ./agent/config/... ./agent/proxycfg/... ./agent/structs/... ./agent/submatview/... ./agent/xds/... ./command/connect/envoy/... ./version/..." \
            -- -tags hashicorpmetrics -timeout 30m

      # The whole ./agent package is too slow and memory-hungry for one standard
      # runner, so run only the tests for the code BC patches change there: check
      # registration (the check monitor backport) and the HTTP handler wrapper
      # (log_acl_info).
      - name: Test agent
        run: |
          go run gotest.tools/gotestsum@v1.12.3 \
            --format=github-actions \
            --rerun-fails \
            --packages="./agent/" \
            -- -tags hashicorpmetrics -timeout 30m \
            -run 'TestAgent_(AddCheck|AddService|RemoveCheck|RemoveService|UpdateCheck)|TestHTTPAPI|TestHTTP_wrap'

      - name: Test envoyextensions
        working-directory: envoyextensions
        run: go test -tags hashicorpmetrics ./...
